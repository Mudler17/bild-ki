<div class="container-fluid mt-3"
  style="font-family: Arial, Helvetica, sans-serif; color: #212529; max-width: 1050px;">

  <!-- ===================================================== -->
  <!-- KOPFBEREICH -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="background-color: #a14a03; color: #ffffff; border-radius: 14px; overflow: hidden;">

    <div class="card-body p-4 p-md-5">

      <p class="mb-2"
        style="font-size: 0.95rem; font-weight: 600; color: #fff3e8;">
        Fortgeschrittene · Modul 1 · Seite 4
      </p>

      <h1 class="font-weight-bold mb-3"
        style="color: #ffffff; line-height: 1.15;">
        Risiken einordnen: Daten, Aufgabe, Folgen
      </h1>

      <p class="mb-4"
        style="font-size: 1.15rem; line-height: 1.6; color: #ffffff;">
        Ein KI-Einsatz kann an einer Stelle unproblematisch
        und an einer anderen kritisch sein.
        Deshalb reicht die Frage nach dem Datenschutz allein nicht aus.
      </p>


      <div class="row">

        <!-- ZEIT -->
        <div class="col-md-4 mb-3 mb-md-0">
          <div class="h-100 p-3"
            style="background-color: rgba(255,255,255,0.14);
                   border: 1px solid rgba(255,255,255,0.30);
                   border-radius: 10px;">

            <p class="mb-2"
              style="font-size: 0.9rem; color: #ffffff;">
              Zeitbedarf
            </p>

            <p class="mb-0"
              style="font-size: 1.05rem; font-weight: 700; color: #ffffff;">
              ⏱ Diese Seite: ca. 7 Minuten
            </p>

          </div>
        </div>


        <!-- LERNERGEBNIS -->
        <div class="col-md-8">
          <div class="h-100 p-3"
            style="background-color: rgba(255,255,255,0.14);
                   border: 1px solid rgba(255,255,255,0.30);
                   border-radius: 10px;">

            <p class="mb-2"
              style="font-size: 0.9rem; color: #ffffff;">
              Danach können Sie
            </p>

            <p class="mb-0"
              style="font-size: 1.05rem;
                     line-height: 1.55;
                     font-weight: 700;
                     color: #ffffff;">
              einen geplanten KI-Einsatz anhand mehrerer Risikodimensionen
              einordnen und erkennen,
              wann ein Auftrag begrenzt, geklärt oder gestoppt werden sollte.
            </p>

          </div>
        </div>

      </div>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- KERNIDEE -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Risiko ist mehrdimensional
      </h2>

      <p style="font-size: 1.05rem; line-height: 1.65; color: #333333;">
        Auch ein Einsatz ohne sensible Daten kann problematisch werden,
        wenn KI fachlich bewertet,
        verbindliche Aussagen erzeugt
        oder Entscheidungen über Menschen vorbereitet.
      </p>


      <div class="p-3 mt-3"
        style="background-color: #fff7ed;
               border-left: 7px solid #a14a03;
               border-radius: 10px;">

        <p class="mb-0"
          style="font-size: 1.08rem; line-height: 1.65;">
          <strong>Prüffrage:</strong>
          Welche Risiken entstehen aus den verwendeten Informationen,
          der Aufgabe der KI und den möglichen Folgen ihres Ergebnisses?
        </p>

      </div>


      <div class="p-3 mt-3"
        style="background-color: #fff1f2;
               border-left: 6px solid #dc3545;
               border-radius: 10px;">

        <p class="mb-0"
          style="line-height: 1.6;">
          <strong>Vor der Risikoprüfung gilt weiterhin:</strong>
          Ist unklar, ob Tool, Funktion, Anwendungsfall
          oder vorgesehene Informationen zugelassen sind,
          wird nicht gestartet.
          Die offene Frage wird zuerst über die vorgesehenen internen Wege geklärt.
        </p>

      </div>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- WERKSTATTFALL -->
  <!-- ===================================================== -->
  <div class="card shadow-sm mb-4"
    style="background-color: #f8fafc;
           border: 1px solid #d7dee8;
           border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Werkstattfall: Der KI-Einsatz wird erweitert
      </h2>

      <p style="font-size: 1.05rem; line-height: 1.65; color: #333333;">
        Bisher hat Nora KI nur für allgemeine Vorbereitung genutzt.
        Im Team entstehen nun drei weitergehende Ideen.
      </p>


      <div class="row mt-3">

        <!-- IDEE 1 -->
        <div class="col-md-4 mb-3">
          <div class="h-100 p-3"
            style="background-color: #f3fbf6;
                   border-top: 5px solid #198754;
                   border-radius: 12px;">

            <p class="mb-1"
              style="font-size: 0.9rem; color: #52705e;">
              Idee 1
            </p>

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #146c43;">
              Allgemeine Checkliste
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              KI soll aus allgemeinen Stichpunkten
              eine neutrale Checkliste für Teamrückmeldungen erstellen.
            </p>

          </div>
        </div>


        <!-- IDEE 2 -->
        <div class="col-md-4 mb-3">
          <div class="h-100 p-3"
            style="background-color: #fff8e5;
                   border-top: 5px solid #d39e00;
                   border-radius: 12px;">

            <p class="mb-1"
              style="font-size: 0.9rem; color: #766838;">
              Idee 2
            </p>

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #6b5300;">
              Rückmeldungen zusammenfassen
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              KI soll echte Teamrückmeldungen zusammenfassen,
              darunter kritische Hinweise zu Arbeitsweisen.
            </p>

          </div>
        </div>


        <!-- IDEE 3 -->
        <div class="col-md-4 mb-3">
          <div class="h-100 p-3"
            style="background-color: #fff1f2;
                   border-top: 5px solid #dc3545;
                   border-radius: 12px;">

            <p class="mb-1"
              style="font-size: 0.9rem; color: #89545b;">
              Idee 3
            </p>

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #9f1f1f;">
              Einführung empfehlen
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              KI soll bewerten,
              ob die Vorlage verbindlich eingeführt werden sollte.
            </p>

          </div>
        </div>

      </div>


      <p class="mb-0 mt-2"
        style="line-height: 1.65;">
        Die drei Ideen betreffen dasselbe Thema.
        Ihr Risikoprofil ist trotzdem sehr unterschiedlich.
      </p>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- FÜNF DIMENSIONEN -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Fünf Risikodimensionen
      </h2>

      <p style="font-size: 1.05rem; line-height: 1.65; color: #333333;">
        Prüfen Sie nicht nur einen einzelnen Punkt.
        Entscheidend ist das Zusammenspiel dieser fünf Dimensionen.
      </p>


      <div class="row mt-3">

        <!-- DATEN -->
        <div class="col-md-6 mb-3">
          <div class="h-100 p-3"
            style="background-color: #eef7ff;
                   border-left: 6px solid #0d6efd;
                   border-radius: 10px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #0b4f9c;">
              1. Daten
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              Welche Informationen werden verarbeitet?
              Allgemeine Angaben, interne Inhalte,
              personenbezogene oder besonders schutzbedürftige Informationen?
            </p>

          </div>
        </div>


        <!-- AUFGABE -->
        <div class="col-md-6 mb-3">
          <div class="h-100 p-3"
            style="background-color: #eef9fc;
                   border-left: 6px solid #17a2b8;
                   border-radius: 10px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #116979;">
              2. Aufgabe
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              Formuliert und strukturiert KI nur –
              oder soll sie bewerten,
              empfehlen oder Entscheidungen vorbereiten?
            </p>

          </div>
        </div>


        <!-- FOLGEN -->
        <div class="col-md-6 mb-3">
          <div class="h-100 p-3"
            style="background-color: #fff8e5;
                   border-left: 6px solid #d39e00;
                   border-radius: 10px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #6b5300;">
              3. Folgen
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              Kann das Ergebnis Menschen,
              Kommunikation, Leistungen,
              Konflikte oder weitere Entscheidungen beeinflussen?
            </p>

          </div>
        </div>


        <!-- VERBINDLICHKEIT -->
        <div class="col-md-6 mb-3">
          <div class="h-100 p-3"
            style="background-color: #f7f2ff;
                   border-left: 6px solid #6f42c1;
                   border-radius: 10px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #56309a;">
              4. Verbindlichkeit
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              Bleibt das Ergebnis eine interne Arbeitshilfe –
              oder könnte es als offizielle Aussage,
              Vorgabe oder Entscheidung verstanden werden?
            </p>

          </div>
        </div>


        <!-- ZUSTÄNDIGKEIT -->
        <div class="col-md-12 mb-3">
          <div class="h-100 p-3"
            style="background-color: #f8fafc;
                   border-left: 6px solid #475569;
                   border-radius: 10px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #334155;">
              5. Zuständigkeit
            </h3>

            <p class="mb-0"
              style="line-height: 1.55;">
              Wer muss fachlich prüfen oder entscheiden?
              Je nach Thema können beispielsweise Leitung,
              Fachstelle, Datenschutz, IT, Informationssicherheit,
              QM oder Recht zuständig sein.
            </p>

          </div>
        </div>

      </div>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- RISIKOMATRIX -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Werkzeug: die Risikomatrix
      </h2>

      <p style="font-size: 1.05rem; line-height: 1.65; color: #333333;">
        Die Matrix hilft bei der Orientierung.
        Sie ersetzt weder eine Freigabe
        noch eine fachliche oder rechtliche Prüfung.
      </p>


      <div class="table-responsive mt-3">

        <table class="table table-bordered"
          style="background-color: #ffffff; min-width: 760px;">

          <thead>
            <tr>
              <th style="width: 18%; background-color: #f1f5f9;">
                Dimension
              </th>

              <th style="width: 27%; background-color: #f3fbf6; color: #146c43;">
                eher gering
              </th>

              <th style="width: 27%; background-color: #fff8e5; color: #6b5300;">
                prüfbedürftig
              </th>

              <th style="width: 28%; background-color: #fff1f2; color: #9f1f1f;">
                kritisch
              </th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <th>Daten</th>

              <td>
                allgemeine,
                nicht vertrauliche Informationen
              </td>

              <td>
                interne oder personenbezogene Informationen
                innerhalb eines grundsätzlich geklärten Rahmens
              </td>

              <td>
                besonders schutzbedürftige,
                vertrauliche oder für diesen Einsatz
                nicht zugelassene Informationen
              </td>
            </tr>


            <tr>
              <th>Aufgabe</th>

              <td>
                formulieren,
                strukturieren,
                kürzen
              </td>

              <td>
                fachlich einordnen,
                Varianten vergleichen
              </td>

              <td>
                Menschen bewerten,
                entscheiden,
                verbindliche Maßnahmen empfehlen
              </td>
            </tr>


            <tr>
              <th>Folgen</th>

              <td>
                interne Vorarbeit
                mit geringer Wirkung
              </td>

              <td>
                Einfluss auf Kommunikation,
                Abläufe oder fachliche Bewertung
              </td>

              <td>
                erhebliche Auswirkungen
                auf Menschen, Rechte,
                Leistungen oder Konflikte
              </td>
            </tr>


            <tr>
              <th>Verbindlichkeit</th>

              <td>
                Entwurf,
                Ideensammlung,
                Arbeitshilfe
              </td>

              <td>
                fachlich wirkende Aussage
                oder mögliche Außenwirkung
              </td>

              <td>
                offizielle Aussage,
                Vorgabe oder Entscheidung
              </td>
            </tr>


            <tr>
              <th>Zuständigkeit</th>

              <td>
                eigene Vorarbeit
                im geklärten Rahmen
              </td>

              <td>
                Team-, Leitungs-
                oder Fachbezug
              </td>

              <td>
                fachliche oder organisatorische Entscheidung
                außerhalb der eigenen Zuständigkeit
              </td>
            </tr>

          </tbody>

        </table>

      </div>


      <div class="p-3 mt-3"
        style="background-color: #fff7ed;
               border-left: 7px solid #a14a03;
               border-radius: 10px;">

        <p class="mb-0"
          style="line-height: 1.6;">
          <strong>Wichtig:</strong>
          Es wird nicht einfach gezählt,
          wie viele Felder „grün“ oder „rot“ sind.
          Eine einzige kritische Dimension
          kann den gesamten Einsatz verändern.
        </p>

      </div>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- ANWENDUNG WERKSTATTFALL -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Anwendung auf den Werkstattfall
      </h2>


      <div class="row mt-3">

        <!-- FALL 1 -->
        <div class="col-md-4 mb-3">
          <div class="h-100 p-3"
            style="background-color: #f3fbf6;
                   border: 1px solid #cce8d8;
                   border-radius: 12px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #146c43;">
              Allgemeine Checkliste
            </h3>

            <p style="line-height: 1.55;">
              Allgemeine Stichpunkte,
              vorbereitende Aufgabe,
              geringe unmittelbare Folgen.
            </p>

            <p class="mb-0"
              style="font-weight: bold; color: #146c43;">
              Eher geringes Risiko
            </p>

          </div>
        </div>


        <!-- FALL 2 -->
        <div class="col-md-4 mb-3">
          <div class="h-100 p-3"
            style="background-color: #fff8e5;
                   border: 1px solid #ead9a7;
                   border-radius: 12px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #6b5300;">
              Echte Teamrückmeldungen
            </h3>

            <p style="line-height: 1.55;">
              Daten, mögliche Rückführbarkeit
              und Auswirkungen auf Zusammenarbeit
              müssen geprüft werden.
            </p>

            <p class="mb-0"
              style="font-weight: bold; color: #6b5300;">
              Prüfbedürftig
            </p>

          </div>
        </div>


        <!-- FALL 3 -->
        <div class="col-md-4 mb-3">
          <div class="h-100 p-3"
            style="background-color: #fff1f2;
                   border: 1px solid #efc2c7;
                   border-radius: 12px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #9f1f1f;">
              Einführung empfehlen
            </h3>

            <p style="line-height: 1.55;">
              KI würde eine fachliche
              bzw. organisatorische Entscheidung
              vorbereiten oder vorwegnehmen.
            </p>

            <p class="mb-0"
              style="font-weight: bold; color: #9f1f1f;">
              Kritisch
            </p>

          </div>
        </div>

      </div>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- RISKANTEN AUFTRAG UMBAUEN -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Riskante Aufträge begrenzen
      </h2>

      <p style="font-size: 1.05rem; line-height: 1.65; color: #333333;">
        Ein kritischer Auftrag muss nicht immer bedeuten,
        dass KI überhaupt keinen Beitrag leisten kann.
        Häufig lässt sich die Aufgabe auf eine vorbereitende Funktion zurückführen.
      </p>


      <div class="row mt-3">

        <!-- RISKANT -->
        <div class="col-md-6 mb-3">
          <div class="h-100 p-4"
            style="background-color: #fff1f2;
                   border-left: 7px solid #dc3545;
                   border-radius: 12px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #9f1f1f;">
              Zu weitgehend
            </h3>

            <p class="mb-0"
              style="line-height: 1.65;">
              „Fassen Sie die Rückmeldungen aus dem Team zusammen
              und bewerten Sie,
              ob die Vorlage verbindlich eingeführt werden sollte.“
            </p>

          </div>
        </div>


        <!-- BEGRENZT -->
        <div class="col-md-6 mb-3">
          <div class="h-100 p-4"
            style="background-color: #f3fbf6;
                   border-left: 7px solid #198754;
                   border-radius: 12px;">

            <h3 class="h6 font-weight-bold mb-2"
              style="color: #146c43;">
              Begrenzter Auftrag
            </h3>

            <p class="mb-0"
              style="line-height: 1.65;">
              „Erstellen Sie eine allgemeine Struktur,
              mit der ein Team Rückmeldungen zu einer neuen Vorlage auswerten kann.
              Nennen Sie Prüffragen zur praktischen Nutzbarkeit.
              Treffen Sie keine Empfehlung zur Einführung.“
            </p>

          </div>
        </div>

      </div>


      <div class="p-3 mt-1"
        style="background-color: #eef7ff;
               border-left: 6px solid #0056a6;
               border-radius: 10px;">

        <p class="mb-0"
          style="line-height: 1.6;">
          <strong>Was verändert sich?</strong>
          Die KI bereitet eine Struktur vor.
          Bewertung und Entscheidung bleiben beim zuständigen Team
          beziehungsweise bei den verantwortlichen Personen.
        </p>

      </div>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- INTERAKTIVE ÜBUNG -->
  <!-- ===================================================== -->
  <div class="card border-0 shadow-sm mb-4"
    style="border-radius: 14px;">

    <div class="card-body p-4">

      <h2 class="h4 font-weight-bold mb-3"
        style="color: #1f2937;">
        Vier Situationen – wie ordnen Sie das Risiko ein?
      </h2>

      <p style="font-size: 1.05rem; line-height: 1.65; color: #333333;">
        Wählen Sie die passendste Einordnung.
        Die Rückmeldung zeigt,
        welche Risikodimensionen besonders wichtig sind.
      </p>


      <form id="f1s4-check">

        <!-- FALL 1 -->
        <div class="p-3 mb-3"
          style="background-color: #ffffff;
                 border: 1px solid #d9e2ec;
                 border-radius: 12px;">

          <label for="f1s4-1"
            style="display: block;
                   font-weight: bold;
                   line-height: 1.6;
                   margin-bottom: 12px;">

            1. Aus allgemeinen Stichpunkten
            sollen drei Varianten für eine neutrale Teaminformation entstehen.

          </label>

          <select id="f1s4-1"
            style="width: 100%;
                   border: 1px solid #b8c5d1;
                   border-radius: 8px;
                   padding: 10px;
                   background-color: #ffffff;">

            <option value="">Bitte auswählen</option>
            <option value="gering">eher geringes Risiko</option>
            <option value="pruefen">prüfbedürftig</option>
            <option value="kritisch">kritisch</option>

          </select>

          <div id="f1s4-1-feedback"
            class="mt-3"
            style="display: none;
                   border-left: 6px solid #198754;
                   border-radius: 9px;
                   padding: 13px;
                   line-height: 1.6;">
          </div>

        </div>


        <!-- FALL 2 -->
        <div class="p-3 mb-3"
          style="background-color: #ffffff;
                 border: 1px solid #d9e2ec;
                 border-radius: 12px;">

          <label for="f1s4-2"
            style="display: block;
                   font-weight: bold;
                   line-height: 1.6;
                   margin-bottom: 12px;">

            2. Echte Teamrückmeldungen sollen zusammengefasst werden.
            Es ist nicht sicher,
            ob einzelne Aussagen auf Personen zurückgeführt werden können.

          </label>

          <select id="f1s4-2"
            style="width: 100%;
                   border: 1px solid #b8c5d1;
                   border-radius: 8px;
                   padding: 10px;
                   background-color: #ffffff;">

            <option value="">Bitte auswählen</option>
            <option value="gering">eher geringes Risiko</option>
            <option value="pruefen">prüfbedürftig</option>
            <option value="kritisch">kritisch</option>

          </select>

          <div id="f1s4-2-feedback"
            class="mt-3"
            style="display: none;
                   border-left: 6px solid #198754;
                   border-radius: 9px;
                   padding: 13px;
                   line-height: 1.6;">
          </div>

        </div>


        <!-- FALL 3 -->
        <div class="p-3 mb-3"
          style="background-color: #ffffff;
                 border: 1px solid #d9e2ec;
                 border-radius: 12px;">

          <label for="f1s4-3"
            style="display: block;
                   font-weight: bold;
                   line-height: 1.6;
                   margin-bottom: 12px;">

            3. KI soll entscheiden,
            welche Maßnahme in einem konkreten pädagogischen Fall
            angemessen ist.

          </label>

          <select id="f1s4-3"
            style="width: 100%;
