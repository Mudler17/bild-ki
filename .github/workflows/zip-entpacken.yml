<!-- INTERAKTION -->
<!-- ===================================================== -->
<script>
(function() {

  var button = document.getElementById('f1s4-pruefen');
  var errorBox = document.getElementById('f1s4-fehler');
  var resultBox = document.getElementById('f1s4-ergebnis');
  var resultText = document.getElementById('f1s4-ergebnis-text');

  if (!button || !errorBox || !resultBox || !resultText) {
    return;
  }


  var items = [

    {
      selectId: 'f1s4-1',
      feedbackId: 'f1s4-1-feedback',
      correct: 'gering',
      explanation:
        'Allgemeine Daten, eine vorbereitende Aufgabe und geringe unmittelbare Folgen sprechen für ein eher niedriges Risiko. Das Ergebnis bleibt trotzdem prüfpflichtig.'
    },

    {
      selectId: 'f1s4-2',
      feedbackId: 'f1s4-2-feedback',
      correct: 'pruefen',
      explanation:
        'Hier sind vor allem Daten und Folgen relevant. Zuerst muss geklärt werden, ob die Rückmeldungen tatsächlich für diesen Einsatz zulässig und nicht auf einzelne Personen zurückführbar sind.'
    },

    {
      selectId: 'f1s4-3',
      feedbackId: 'f1s4-3-feedback',
      correct: 'kritisch',
      explanation:
        'Aufgabe, Folgen und Zuständigkeit sind kritisch. Eine fachliche Entscheidung über einen konkreten Menschen darf nicht einfach an ein KI-System delegiert werden.'
    },

    {
      selectId: 'f1s4-4',
      feedbackId: 'f1s4-4-feedback',
      correct: 'gering',
      explanation:
        'Bei einem freigegebenen allgemeinen Ausgangstext und einer rein sprachlichen Überarbeitung ist das Risiko eher gering. Entscheidend bleibt die inhaltliche Prüfung des Ergebnisses.'
    }

  ];


  button.addEventListener('click', function() {

    var missing = false;
    var correctCount = 0;


    items.forEach(function(item) {

      var select = document.getElementById(item.selectId);

      if (!select || !select.value) {
        missing = true;
      }

    });


    if (missing) {

      errorBox.style.display = 'block';
      resultBox.style.display = 'none';

      return;
    }


    errorBox.style.display = 'none';


    items.forEach(function(item) {

      var select = document.getElementById(item.selectId);
      var feedback = document.getElementById(item.feedbackId);

      if (!select || !feedback) {
        return;
      }


      var correct = select.value === item.correct;

      if (correct) {
        correctCount++;
      }


      feedback.style.display = 'block';


      if (correct) {

        feedback.style.backgroundColor = '#f3fbf6';
        feedback.style.borderLeftColor = '#198754';
        feedback.style.color = '#146c43';

        feedback.textContent =
          'Passend eingeordnet. ' + item.explanation;

      } else {

        feedback.style.backgroundColor = '#fff8e5';
        feedback.style.borderLeftColor = '#d39e00';
        feedback.style.color = '#6b5300';

        feedback.textContent =
          'Noch einmal prüfen. ' + item.explanation;

      }

    });


    resultBox.style.display = 'block';


    if (correctCount === items.length) {

      resultText.textContent =
        'Alle vier Situationen passend eingeordnet. Sie haben berücksichtigt, dass das Risiko nicht nur von den Daten, sondern auch von Aufgabe, Folgen, Verbindlichkeit und Zuständigkeit abhängt.';

    } else {

      resultText.textContent =
        correctCount +
        ' von 4 Situationen passend eingeordnet. Lesen Sie die Rückmeldungen unter den Fällen. Prüfen Sie besonders, ob eine zunächst harmlose Aufgabe durch sensible Informationen, Bewertung oder mögliche Folgen ein anderes Risikoprofil bekommt.';

    }


    resultBox.scrollIntoView({
      behavior: 'smooth',
      block: 'nearest'
    });

  });

})();
</script>
